services:
  - type: web
    name: nexa-staging
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci --prefix backend
    startCommand: npm run db:migrate --prefix backend && npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexa-staging-db
          property: connectionString
      - key: DATABASE_SSL_MODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: MP_ALLOW_TEST_PAYMENTS
        value: "true"
      - key: ADMIN_EMAILS
        sync: false

databases:
  - name: nexa-staging-db
    databaseName: nexa_staging
    user: nexa_staging
    plan: free
    region: ohio
    ipAllowList: []
