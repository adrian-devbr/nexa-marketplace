<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <main class="pagina-conteudo">
        <h1>Moderação de anúncios</h1>
        <p data-access-error class="mensagem-pagina mensagem-erro" hidden></p>

            <div class="lista-pedidos" data-reported-reviews></div>
