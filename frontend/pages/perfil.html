<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0a10">
    <title>Meu perfil | NEXA</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js" defer></script>
    <script src="../js/storage.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/perfil.js" defer></script>
</head>
<body>
    <header>
        <nav aria-label="Navegação principal">
            <a class="logo" href="../index.html">NEXA</a>
            <div class="menu">
                <a href="../index.html">Início</a>
                <a href="../index.html#destaques">Anúncios</a>
                <a href="painel.html" data-member-link hidden>Painel</a>
                <a href="login.html" data-auth-link>Entrar</a>
            </div>
        </nav>
    </header>

    <main class="pagina-conta">
        <section class="perfil-container" aria-labelledby="titulo-perfil">
            <p class="etiqueta">Minha conta</p>
            <h1 id="titulo-perfil">Meu perfil</h1>
            <p class="mensagem-pagina" data-login-required hidden>
                Entre na sua conta para visualizar e editar seu perfil.
                <a href="login.html">Ir para o login</a>.
            </p>

            <div data-profile-content hidden>
                <section class="reputacao-perfil">
                    <h2 data-profile-name></h2>
                    <p data-profile-rating></p>
                    <p data-profile-member-since></p>
                </section>
                <dl class="dados-perfil">
                    <div data-private-email>
                        <dt>E-mail da conta</dt>
                        <dd data-profile-email></dd>
                    </div>
                    <div>
                        <dt>Anúncios publicados</dt>
                        <dd data-profile-listing-count>0</dd>
                    </div>
                </dl>

                <form class="formulario-perfil" data-profile-form>
                    <label for="profile-name">Nome de exibição</label>
                    <input
                        id="profile-name"
                        name="name"
                        type="text"
                        maxlength="60"
                        autocomplete="name"
                        required
                    >
                    <button type="submit">Salvar nome</button>
                    <p class="mensagem-pagina" data-profile-message role="status" aria-live="polite" hidden></p>
                </form>

                <div class="acoes-perfil" data-own-profile>
                    <a class="botao-link" href="painel.html">Gerenciar meus anúncios</a>
                </div>
                <section class="reviews-section" aria-labelledby="profile-reviews-title">
                    <h2 id="profile-reviews-title">Avaliações</h2>
                    <div data-profile-reviews></div>
                </section>
                <section class="reviews-section" aria-labelledby="profile-listings-title">
                    <h2 id="profile-listings-title">Anúncios publicados</h2>
                    <div data-profile-listings class="lista-pedidos"></div>
                </section>
            </div>
            <p data-profile-error class="mensagem-pagina mensagem-erro" role="status" hidden></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NEXA. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
